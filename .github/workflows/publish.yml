name: Publish CloudStream repository
on:
  workflow_dispatch:
  push:
    paths:
      - 'repo.json'
      - '.github/workflows/publish.yml'
  workflow_run:
    workflows: ['Build Pelis182']
    types: [completed]
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-cloudstream
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find successful build
        id: build
        uses: actions/github-script@v7
        with:
          script: |
            const {data} = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'build.yml', branch: 'main', status: 'success', per_page: 1
            });
            if (!data.workflow_runs.length) throw new Error('No successful build found');
            core.setOutput('run_id', String(data.workflow_runs[0].id));
      - uses: actions/download-artifact@v4
        with:
          name: Pelis182-cs3
          path: artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.build.outputs.run_id }}
      - name: Publish JSON and CS3
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE"
          PUB="$RUNNER_TEMP/pelis182-publication"
          mkdir -p "$PUB"
          cd "$PUB"
          git init -b builds
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $AUTH"
          if git ls-remote --exit-code --heads origin builds > /dev/null; then
            git fetch --depth=1 origin builds
            git reset --hard FETCH_HEAD
          fi
          export SRC PUB
          python3 - <<'PY'
          import os, json, shutil
          from pathlib import Path
          src, pub = Path(os.environ['SRC']), Path(os.environ['PUB'])
          files = list((src / 'artifact').rglob('*.cs3'))
          assert len(files) == 1, f'Expected one cs3, found {len(files)}'
          target = pub / 'Pelis182.cs3'
          shutil.copy2(files[0], target)
          shutil.copy2(src / 'repo.json', pub / 'repo.json')
          repo = os.environ['GITHUB_REPOSITORY']
          entry = dict(apiVersion=1, repositoryUrl=f'https://github.com/{repo}', fileSize=target.stat().st_size, status=1, language='es', authors=['raiderking2022-wq'], tvTypes=['Movie'], version=1, internalName='Pelis182', description='Pelis182 experimental. Series pendientes.', url=f'https://raw.githubusercontent.com/{repo}/builds/Pelis182.cs3', name='Pelis182')
          (pub / 'plugins.json').write_text(json.dumps([entry], ensure_ascii=False, indent=2) + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Pelis182.cs3 plugins.json repo.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish Pelis182 and repository JSON'
            git push origin HEAD:builds
          fi
