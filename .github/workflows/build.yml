name: Build Pelis182
on:
  workflow_dispatch:
  push:
    paths:
      - 'Pelis182/**'
      - '.github/workflows/build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Prepare template
        run: |
          git clone --depth=1 https://github.com/cloudstream3/plugin-template.git "$RUNNER_TEMP/cs-template"
          cp -R Pelis182 "$RUNNER_TEMP/cs-template/Pelis182"
          cd "$RUNNER_TEMP/cs-template"
          rm -rf ExampleProvider
          sed -i 's/ExampleProvider/Pelis182/g' settings.gradle.kts
          chmod +x gradlew
      - name: Compile cs3
        working-directory: ${{ runner.temp }}/cs-template
        run: ./gradlew Pelis182:make --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Pelis182-cs3
          path: ${{ runner.temp }}/cs-template/Pelis182/build/**/*.cs3
          if-no-files-found: error
