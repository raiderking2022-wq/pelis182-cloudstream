name: Build Pelis182
on:
  workflow_dispatch:
  push:
    paths:
      - 'Pelis182/**'
      - '.github/workflows/build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Prepare current CloudStream build configuration
        shell: bash
        run: |
          git clone --depth=1 https://github.com/recloudstream/TestPlugins.git "$RUNNER_TEMP/cs-build"
          cp -R Pelis182 "$RUNNER_TEMP/cs-build/Pelis182"
          cd "$RUNNER_TEMP/cs-build"
          printf 'rootProject.name = "CloudstreamPlugins"\ninclude("Pelis182")\n' > settings.gradle.kts
          git rev-parse HEAD
          chmod +x gradlew
      - name: Compile cs3
        working-directory: ${{ runner.temp }}/cs-build
        run: ./gradlew Pelis182:make --stacktrace --info --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Pelis182-cs3
          path: ${{ runner.temp }}/cs-build/Pelis182/build/**/*.cs3
          if-no-files-found: error
